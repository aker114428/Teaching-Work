<style>
:root{--bg:#eef3f8;--card:#fff;--ink:#172238;--muted:#6b7788;--blue:#165a8f;--line:#dfe7ef}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:980px;margin:auto;padding:11px 16px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.info{min-width:0}.info strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info span{display:block;font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;flex:0 0 auto}
.btn{display:inline-block;text-decoration:none;border-radius:9px;padding:8px 11px;font-size:12px;font-weight:700}
.primary{background:var(--blue);color:#fff}.ghost{background:#edf4fa;color:var(--blue);border:1px solid #d4e4f0}
.wrap{max-width:980px;margin:auto;padding:18px 12px 50px}
.notice{margin:0 0 14px;padding:10px 13px;border-radius:12px;background:#eaf3fa;color:#456079;font-size:13px}
.page{margin:0 auto 18px;background:white;border-radius:14px;overflow:hidden;box-shadow:0 6px 22px rgba(25,50,75,.08);border:1px solid var(--line)}
.page img{width:100%;height:auto;display:block;background:#fff}
.page figcaption{font-size:12px;color:#8a95a5;text-align:center;padding:7px 0 8px;border-top:1px solid #edf0f3}
.bottom{text-align:center;color:#98a2b3;font-size:12px;padding:8px 0 20px}
@media(max-width:600px){
 .topin{padding:9px 10px}.info strong{font-size:14px}.actions .btn{padding:7px 9px}
 .wrap{padding:10px 7px 35px}.page{border-radius:9px;margin-bottom:10px}.notice{font-size:12px}
}
</style>
